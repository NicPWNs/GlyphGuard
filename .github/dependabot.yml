version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows and action.yml current.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/workflows"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # let new releases settle before adopting them
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # Keeps the digest-pinned fuzzing base image current.
  - package-ecosystem: docker
    directory: /.clusterfuzzlite
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci

  # Keeps the hash-pinned CI tool locks in .github/requirements/ current.
  - package-ecosystem: pip
    directory: /.github/requirements
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      ci-tools:
        patterns: ["*"]
    commit-message:
      prefix: ci
