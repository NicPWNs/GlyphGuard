version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows and action.yml current.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/workflows"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # let new releases settle before adopting them
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
