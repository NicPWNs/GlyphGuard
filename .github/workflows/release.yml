name: Release

# Two ways to release:
#   1. Actions > Release > Run workflow, enter a version such as 0.1.0. The workflow tags
#      the head of main as v0.1.0 and releases it.
#   2. Push a tag yourself: git tag -a v0.1.0 -m "GlyphGuard 0.1.0" && git push origin v0.1.0
# Either way CHANGELOG.md must already have a "## [0.1.0]" section; it becomes the notes.
# The package version comes from the tag (hatch-vcs), so nothing else needs bumping.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the v (e.g. 0.1.0 or 0.2.0rc1)
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    name: Create tag
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # push the tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true # needed to push the tag
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Validate and push the tag
        env:
          VERSION: ${{ inputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$BRANCH" != "main" ]]; then
            echo "::error::Releases are cut from main, not $BRANCH"
            exit 1
          fi
          python scripts/release_notes.py "$VERSION" > /dev/null
          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "GlyphGuard $VERSION"
          git push origin "v$VERSION"

  build:
    name: Build and test
    needs: tag
    if: ${{ !cancelled() && (needs.tag.result == 'success' || needs.tag.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # build provenance attestation
      attestations: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - name: Resolve the tag
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "push" ]]; then tag="$REF_NAME"; else tag="v$INPUT_VERSION"; fi
          version="${tag#v}"
          if [[ "$version" =~ (a|b|rc)[0-9]+$ ]]; then prerelease=true; else prerelease=false; fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.meta.outputs.tag }}
          fetch-depth: 0 # the version comes from the tag
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mkdir -p notes
          python scripts/release_notes.py "$VERSION" > notes/release-notes.md
      - run: python -m pip install --require-hashes -r .github/requirements/build.txt
      - run: python -m build
      - name: Check the built version matches the tag
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          ls dist
          test -f "dist/glyphguard-$VERSION.tar.gz"
          test -f "dist/glyphguard-$VERSION-py3-none-any.whl"
      - run: python -m twine check --strict dist/*
      - name: Test the built wheel
        run: |
          python -m pip install --require-hashes -r .github/requirements/test.txt
          python -m pip install --no-deps dist/*.whl
          python -m pytest tests -o addopts="--strict-markers"
      - name: Hash the built files for SLSA provenance
        id: hashes
        working-directory: dist
        run: echo "hashes=$(sha256sum -- * | base64 -w0)" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        # Artifact attestations need a public repository (or GitHub Enterprise Cloud).
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: notes/release-notes.md
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=(--verify-tag --title "GlyphGuard $VERSION" --notes-file notes/release-notes.md)
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* "${flags[@]}" --repo "$GITHUB_REPOSITORY"

  pypi:
    name: Publish to PyPI
    # Off until PyPI Trusted Publishing is configured: then set the repository variable
    # PYPI_PUBLISH=true (Settings > Secrets and variables > Actions > Variables).
    needs: build
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/glyphguard/
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  provenance:
    name: SLSA provenance
    needs: [build, github-release]
    permissions:
      actions: read # read the workflow run being attested
      id-token: write # sign the provenance
      contents: write # attach it to the release
    # The SLSA generator must be referenced by tag, not SHA: it verifies its own version.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0 # zizmor: ignore[unpinned-uses]
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      upload-assets: true
      upload-tag-name: ${{ needs.build.outputs.tag }}
      provenance-name: glyphguard-${{ needs.build.outputs.version }}.intoto.jsonl

  sign:
    name: Sigstore signatures
    # After PyPI, so the signing workflow can check the files against what was published.
    needs: [build, github-release, pypi]
    if: ${{ !cancelled() && needs.github-release.result == 'success' }}
    permissions:
      contents: write # attach the signatures to the release
      id-token: write # keyless Sigstore signing
    uses: ./.github/workflows/sign-release.yml # zizmor: ignore[self-repository]
    with:
      tag: ${{ needs.build.outputs.tag }}
