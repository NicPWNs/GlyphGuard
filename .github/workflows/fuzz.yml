name: Fuzzing

# Coverage-guided fuzzing of detection and sanitization with ClusterFuzzLite and Atheris
# (targets in tests/fuzz/). Pull requests get a short run focused on the changed code; a
# longer batch run happens weekly and on demand.

on:
  pull_request:
  schedule:
    - cron: "37 3 * * 0" # Sundays, 03:37 UTC
  workflow_dispatch:

permissions: {}

jobs:
  pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: fuzz-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          github-token: ${{ github.token }}
          sanitizer: address
      - uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ github.token }}
          fuzz-seconds: 300
          mode: code-change
          sanitizer: address

  batch:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          github-token: ${{ github.token }}
          sanitizer: address
      - uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ github.token }}
          fuzz-seconds: 1800
          mode: batch
          sanitizer: address
