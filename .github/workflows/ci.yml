name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install -e . ruff mypy pytest hypothesis
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e . pytest hypothesis
      - run: pytest

  unicode-data:
    # The vendored tables must match what scripts/gen_data.py produces from unicode.org.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python scripts/gen_data.py --check

  dogfood:
    # GlyphGuard scans its own repository.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install -e .
      - run: git ls-files -z -- . ':!src/glyphguard/_data/' | xargs -0 glyphguard detect --fail-on low
