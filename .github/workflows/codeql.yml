name: CodeQL

# Code scanning needs a public repository (or GitHub Advanced Security), so the job
# skips itself while the repository is private.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * 3" # Wednesdays, 05:41 UTC

permissions: {}

jobs:
  analyze:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: python, actions
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
