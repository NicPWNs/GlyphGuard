# Language-neutral conformance vectors: every implementation of GlyphGuard must flag these.
#
#   text      input (TOML escapes: \uXXXX, \UXXXXXXXX)
#   expect    technique IDs that must be reported (others may be reported too)
#   severity  minimum severity of the highest expected finding (optional)
#   payload   decoded hidden content that must be recovered (optional)
#   sanitized expected output of the llm-input profile (optional)

[[vector]]
name = "zero-width space splitting a keyword"
text = "fun\u200Bding"
expect = ["GG-INV-001"]
severity = "medium"
sanitized = "funding"

[[vector]]
name = "word joiner and inner BOM"
text = "pay\u2060pal\uFEFF"
expect = ["GG-INV-001"]
sanitized = "paypal"

[[vector]]
name = "ZWJ between Latin letters"
text = "ad\u200Dmin"
expect = ["GG-INV-001"]
sanitized = "admin"

[[vector]]
name = "invisible math operators"
text = "a\u2062b\u2064c"
expect = ["GG-INV-002"]
sanitized = "abc"

[[vector]]
name = "soft hyphen and combining grapheme joiner"
text = "ad\u00ADmi\u034Fn"
expect = ["GG-INV-003"]
sanitized = "admin"

[[vector]]
name = "Hangul filler display name"
text = "\u3164"
expect = ["GG-INV-004", "GG-INV-005"]
sanitized = ""

[[vector]]
name = "Braille blank padding"
text = "admin\u2800\u2800"
expect = ["GG-INV-004"]
sanitized = "admin"

[[vector]]
name = "only ideographic spaces"
text = "\u3000\u3000"
expect = ["GG-INV-005", "GG-INV-006"]

[[vector]]
name = "em space inside a word"
text = "ad\u2003min"
expect = ["GG-INV-006"]
sanitized = "ad min"

[[vector]]
name = "noncharacter"
text = "a\uFDD0b"
expect = ["GG-INV-007"]
sanitized = "ab"

[[vector]]
name = "unassigned code point"
text = "a\u0378b"
expect = ["GG-INV-008"]

[[vector]]
name = "single private-use character"
text = "icon \uE001"
expect = ["GG-INV-009"]

[[vector]]
name = "ASCII smuggling with tags"
text = "Hello\U000E0049\U000E0067\U000E006E\U000E006F\U000E0072\U000E0065\U000E0020\U000E0061\U000E006C\U000E006C"
expect = ["GG-SMUG-001"]
severity = "critical"
payload = "Ignore all"
sanitized = "Hello"

[[vector]]
name = "tags wrapped in LANGUAGE TAG and CANCEL TAG"
text = "\U000E0001\U000E0068\U000E0069\U000E007F"
