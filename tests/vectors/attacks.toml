payload = "hi"

[[vector]]
name = "tag letters after a non-flag base"
text = "\U0001F600\U000E0067\U000E0062\U000E0073\U000E0063\U000E0074\U000E007F"
expect = ["GG-SMUG-001"]

[[vector]]
name = "variation selector byte smuggling"
text = "\U0001F60A\U000E0158\U000E0155\U000E015C\U000E015C\U000E015F"
expect = ["GG-SMUG-002"]
severity = "critical"
payload = "hello"
sanitized = "\U0001F60A"

[[vector]]
name = "orphan variation selector on a Latin letter"
text = "a\uFE0Fb"
expect = ["GG-SMUG-002"]
sanitized = "ab"

[[vector]]
name = "stacked variation selectors"
text = "x\uFE00\uFE01\uFE02"
