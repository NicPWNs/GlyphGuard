name: GlyphGuard
description: Find hidden Unicode (invisible text, smuggled payloads, bidi overrides, terminal escapes) in pull requests.
author: Nic Jones
branding:
  icon: eye
  color: green

inputs:
  paths:
    description: >-
      Files to scan, separated by whitespace. Defaults to every file tracked by git.
      Binary files are skipped.
    required: false
    default: ""
  fail-on:
    description: Fail the step when a finding reaches this severity (info, low, medium, high, critical).
    required: false
    default: medium
  min-severity:
    description: Hide findings below this severity.
    required: false
    default: low
  upload-sarif:
    description: >-
      Upload the results to GitHub code scanning (Security tab) as well as annotating the
      diff. Needs `security-events: write` permission and code scanning enabled, which is
      free for public repositories.
    required: false
    default: "false"
  sarif-file:
    description: Where to write the SARIF 2.1.0 results.
    required: false
    default: glyphguard.sarif
  category:
    description: Code scanning category, to tell several GlyphGuard runs apart.
    required: false
    default: glyphguard
  python-version:
    description: Python version used to run GlyphGuard (3.11 or later).
    required: false
    default: "3.13"

outputs:
  sarif-file:
    description: Path of the SARIF results file.
    value: ${{ steps.scan.outputs.sarif-file }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install GlyphGuard
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --quiet --disable-pip-version-check "$ACTION_PATH"

    - name: Scan for hidden Unicode
      id: scan
      shell: bash
      env:
        PATHS: ${{ inputs.paths }}
        FAIL_ON: ${{ inputs.fail-on }}
        MIN_SEVERITY: ${{ inputs.min-severity }}
        SARIF_FILE: ${{ inputs.sarif-file }}
      run: |
        set -euo pipefail
        echo "sarif-file=$SARIF_FILE" >> "$GITHUB_OUTPUT"
        args=(detect --format github --sarif "$SARIF_FILE"
              --fail-on "$FAIL_ON" --min-severity "$MIN_SEVERITY")
        if [[ -n "$PATHS" ]]; then
          read -r -a files <<< "$PATHS"
          glyphguard "${args[@]}" -- "${files[@]}"
        else
          git ls-files -z | glyphguard "${args[@]}" --files0-from -
        fi

    - name: Upload to code scanning
      if: ${{ !cancelled() && inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
      with:
        sarif_file: ${{ inputs.sarif-file }}
        category: ${{ inputs.category }}
