[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "glyphguard"
dynamic = ["version"]
description = "See what the machine sees. Unicode security for humans, filters, and models."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Nic Jones" }]
keywords = [
  "unicode", "security", "homoglyph", "confusables", "prompt-injection", "ascii-smuggling",
  "trojan-source", "llm", "red-team", "sanitization",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Text Processing :: Filters",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/NicPWNs/GlyphGuard"
Issues = "https://github.com/NicPWNs/GlyphGuard/issues"
Changelog = "https://github.com/NicPWNs/GlyphGuard/blob/main/CHANGELOG.md"
Security = "https://github.com/NicPWNs/GlyphGuard/security/policy"

[project.scripts]
glyphguard = "glyphguard.cli:main"

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.15", "mypy>=1.15"]

[tool.hatch.version]
path = "src/glyphguard/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src/glyphguard", "scripts", "tests", "README.md", "CHANGELOG.md", "LICENSE", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
pythonpath = ["tests"]
addopts = ["--strict-markers", "--doctest-modules", "--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/glyphguard/_data/ucd.py", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "PT", "C4"]
ignore = [
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004",  # table-driven code
  "RUF001", "RUF002", "RUF003",                           # this project is *about* ambiguous characters
  "SIM905",                                               # word lists read better as split strings
]

[tool.ruff.lint.per-file-ignores]
"scripts/make_brand.py" = ["E501", "PLC0415"]  # SVG markup strings; optional resvg import

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests", "scripts"]
exclude = ['scripts/make_brand\.py']  # optional brand tooling (fonttools, resvg-py)
