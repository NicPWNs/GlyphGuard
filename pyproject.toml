[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4", "hatch-fancy-pypi-readme>=24"]
build-backend = "hatchling.build"

[project]
name = "glyphguard"
dynamic = ["version", "readme"]
description = "Detect, decode and remove hidden Unicode: invisible text, ASCII smuggling, homoglyphs, Trojan Source bidi and prompt injection in LLM input, code and AI agent files."
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Nic Jones" }]
keywords = [
  "unicode", "unicode-security", "security", "prompt-injection", "llm", "llm-security",
  "ai-security", "guardrails", "homoglyph", "homograph", "confusables", "uts39",
  "ascii-smuggling", "tag-smuggling", "invisible-characters", "zero-width", "steganography",
  "trojan-source", "bidi", "punycode", "idn", "sanitization", "mcp", "sarif",
  "github-action", "pre-commit", "red-team",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Text Processing :: Filters",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/NicPWNs/GlyphGuard"
Documentation = "https://github.com/NicPWNs/GlyphGuard/blob/main/docs/guide.md"
Repository = "https://github.com/NicPWNs/GlyphGuard"
"GitHub Action" = "https://github.com/marketplace/actions/glyphguard"
Issues = "https://github.com/NicPWNs/GlyphGuard/issues"
Changelog = "https://github.com/NicPWNs/GlyphGuard/blob/main/CHANGELOG.md"
Security = "https://github.com/NicPWNs/GlyphGuard/security/policy"

[project.scripts]
glyphguard = "glyphguard.cli:main"

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.15", "mypy>=1.15"]

[tool.hatch.version]
source = "vcs"  # the version comes from the latest v* git tag

[tool.hatch.version.raw-options]
fallback_version = "0.0.0"  # source archives without git history, e.g. the GitHub Action
local_scheme = "no-local-version"

# The PyPI description is README.md with repository-relative images and links made
# absolute: PyPI can't resolve paths like docs/assets/... the way GitHub does.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(src|srcset)="(?!https?://|#)([^"]+)"'
replacement = '\1="https://raw.githubusercontent.com/NicPWNs/GlyphGuard/main/\2"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'href="(?!https?://|#)([^"]+)"'
replacement = 'href="https://github.com/NicPWNs/GlyphGuard/blob/main/\1"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)([^)]+)\)'
replacement = '](https://github.com/NicPWNs/GlyphGuard/blob/main/\1)'

[tool.hatch.build.targets.sdist]
include = ["src/glyphguard", "scripts", "tests", "README.md", "CHANGELOG.md", "LICENSE", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
pythonpath = ["tests"]
addopts = ["--strict-markers", "--doctest-modules", "--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/glyphguard/_data/ucd.py", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "PT", "C4"]
ignore = [
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004",  # table-driven code
  "RUF001", "RUF002", "RUF003",                           # this project is *about* ambiguous characters
  "SIM905",                                               # word lists read better as split strings
]

[tool.ruff.lint.per-file-ignores]
"scripts/make_brand.py" = ["E501", "PLC0415"]  # SVG markup strings; optional resvg import

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests", "scripts"]
exclude = ['scripts/make_brand\.py']  # optional brand tooling (fonttools, resvg-py)

[[tool.mypy.overrides]]
module = ["atheris"]  # the fuzz target's engine, only installed in the fuzzing image
ignore_missing_imports = true
